# Render Blueprint — TalentOs backend
# Docs: docs/DEPLOY_RENDER.md
# Dashboard: set env vars manually (never commit secrets).

services:
  - type: web
    name: talentos-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        value: https://pfe-recrutement-ia.vercel.app
      - key: CORS_EXTRA_ORIGINS
        value: https://pfe-recrutement-ia.vercel.app
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
